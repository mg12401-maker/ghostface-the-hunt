
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghostface: The Hunt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">
  <div id="menu" class="screen">
    <h1>GHOSTFACE</h1>
    <h2>THE HUNT</h2>
    <p>Una cacería en el bosque...</p>
    <button id="start">JUGAR</button>
    <p class="instructions">
      A / D o flechas: moverse<br>
      W / ↑: saltar<br>
      ESPACIO: atacar
    </p>
  </div>

  <div id="hud">
    <span>🔪 GHOSTFACE: <b id="ghostLives">3</b></span>
    <span>🪓 JASON: <b id="jasonLives">3</b></span>
    <span>⭐ PUNTOS: <b id="score">0</b></span>
  </div>

  <canvas id="canvas" width="900" height="450"></canvas>

  <div id="message" class="screen hidden">
    <h1 id="result"></h1>
    <p id="finalScore"></p>
    <button id="restart">VOLVER A JUGAR</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
